# Weekly rebuild of the board's timetable data (owner, Nov 2026).
#
# Downloads the MTA's current subway, bus and LIRR timetables (GTFS), the
# MTA's subway entrances (data.ny.gov) and PATH's
# timetable pages, reruns the build scripts, and commits the data files only
# if something changed. Most weeks nothing changes; when the MTA or PATH
# publishes a new timetable, the board picks it up within a week.
# Run it by hand from the Actions tab ("Run workflow") after a known change.
name: Rebuild timetable data

on:
  schedule:
    - cron: '23 7 * * 1'   # Mondays 07:23 UTC (about 2:23 AM in New York)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # a GitHub-signed token proves this workflow to the relay (NJ Transit timetable)

concurrency:
  group: rebuild-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download MTA timetables
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gtfs_subway.zip" https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gtfslirr.zip" https://rrgtfsfeeds.s3.amazonaws.com/gtfslirr.zip
          for f in gtfs_bx gtfs_m gtfs_q gtfs_b gtfs_si gtfs_busco; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f.zip" "https://rrgtfsfeeds.s3.amazonaws.com/$f.zip"
          done

      - name: Subway data (lines, late nights, on-time times, shapes)
        run: python3 scripts/build-subway-data.py "$RUNNER_TEMP/gtfs_subway.zip"

      - name: Subway route guidance (fastest alternatives)
        run: python3 scripts/build-subway-guide.py "$RUNNER_TEMP/gtfs_subway.zip"

      - name: Buses between nearby subway stations (for skipped stops)
        run: python3 scripts/build-subway-bus-links.py "$RUNNER_TEMP/gtfs_subway.zip" "$RUNNER_TEMP"/gtfs_bx.zip "$RUNNER_TEMP"/gtfs_m.zip "$RUNNER_TEMP"/gtfs_q.zip "$RUNNER_TEMP"/gtfs_b.zip "$RUNNER_TEMP"/gtfs_si.zip "$RUNNER_TEMP"/gtfs_busco.zip

      - name: Buses to JFK and LaGuardia (airport helper)
        run: python3 scripts/build-airport-buses.py "$RUNNER_TEMP/gtfs_subway.zip" "$RUNNER_TEMP"/gtfs_q.zip "$RUNNER_TEMP"/gtfs_b.zip "$RUNNER_TEMP"/gtfs_busco.zip "$RUNNER_TEMP"/gtfs_m.zip

      - name: Bus to Islip airport (Suffolk County Transit route 6)
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sct.zip" https://tracksctbus.org/gtfs
          python3 scripts/build-isp-bus.py "$RUNNER_TEMP/sct.zip"

      - name: Subway entrances (MTA open data)
        continue-on-error: true
        run: python3 scripts/build-subway-entrances.py

      - name: LIRR map data
        run: python3 scripts/build-lirr-data.py "$RUNNER_TEMP/gtfslirr.zip"

      - name: LIRR timetable (other options for delayed trains)
        run: python3 scripts/build-lirr-timetable.py "$RUNNER_TEMP/gtfslirr.zip"

      - name: Penn elevators and escalators (the MTA's advice when one is out)
        continue-on-error: true
        run: python3 scripts/build-penn-elevators.py

      - name: Stewart Airport (Metro-North to Beacon; Coach USA part kept as is)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gtfsmnr.zip" https://rrgtfsfeeds.s3.amazonaws.com/gtfsmnr.zip
          python3 scripts/build-swf.py "$RUNNER_TEMP/gtfsmnr.zip"

      - name: NJ Transit timetable (through the relay, locked to this repository)
        # NJ Transit's file needs the owner's login, which only the relay holds.
        # The relay hands it over only with a GitHub-signed token for this repo.
        continue-on-error: true
        run: |
          T=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=penn-board-relay" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsSL --retry 2 -H "Authorization: Bearer $T" -o "$RUNNER_TEMP/njt-rail.zip" https://penn-board-relay.pennstationboard.workers.dev/njt-rail-gtfs
          python3 scripts/build-njt-timetable.py "$RUNNER_TEMP/njt-rail.zip"

      - name: PATH timetable
        # PATH's site is sometimes unreachable; keep the last good timetable then.
        continue-on-error: true
        run: python3 scripts/build-path-schedule.py

      - name: Commit if anything changed
        run: |
          git add docs/*.json
          if git diff --cached --quiet; then
            echo "No timetable changes this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly timetable data rebuild"
          git push
