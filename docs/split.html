<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stations side by side</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Side by side (owner, Nov 25): both boards live at once on a computer, to
     watch for bugs. Each board runs in its own frame, exactly as on its own
     page. "Desktop size" shows each at a computer width, scaled to fit, with larger text;
     "Phone size" shows each as a phone would. Nov 26 (owner): any board on
     either side, and "4 boards" shows every station at once at phone size. -->
<style>
:root { --bg: #0b0f0d; --bar: #121815; --line: #2c4034; --ivory: #f2ead8; --gold: #e6b751; --teal: #8fd3c7; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ivory); font-family: "Archivo", Arial, sans-serif; }
.bar { height: 52px; display: flex; align-items: center; gap: .5rem; padding: 0 12px; white-space: nowrap; overflow-x: auto; background: var(--bar); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 1rem; margin: 0 .4rem 0 0; white-space: nowrap; font-weight: 800; letter-spacing: .02em; }
.bar button, .bar a { font: inherit; font-weight: 700; font-size: .9rem; color: var(--ivory); background: none; border: 1px solid var(--line); border-radius: 99px; padding: .3rem .75rem; cursor: pointer; text-decoration: none; white-space: nowrap; flex: none; }
.bar button[aria-pressed="true"] { background: var(--ivory); color: #121815; border-color: var(--ivory); }
.bar .sp { flex: 1; }
.bar .note { font-size: .85rem; color: #c4ccc2; }
.panes { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 10px; padding: 10px; }
.bar .grp { display: flex; gap: .3rem; align-items: center; }
.bar .grp + .grp { margin-left: .5rem; padding-left: .8rem; border-left: 1px solid var(--line); }
.bar label { font-size: .85rem; color: #c4ccc2; font-weight: 700; }
.bar select { max-width: 15rem; flex: none; font: inherit; font-weight: 700; font-size: .9rem; color: var(--ivory); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .3rem .5rem; cursor: pointer; }
.bar select:focus-visible, .bar button:focus-visible, .bar a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
body.four .two-only { display: none; }
@media (max-width: 1350px) { .bar h1 { display: none; } .bar select { max-width: 12rem; } .bar label { display: none; } .bar .grp + .grp { margin-left: .2rem; padding-left: .5rem; } }
.pane .lab i { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin-right: .4em; vertical-align: -.05em; }
.pane { position: relative; overflow: hidden; border-radius: 8px; border: 1px solid var(--line); background: #000; }
.pane .lab { position: absolute; z-index: 2; left: 10px; bottom: 10px; font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: .2rem .5rem; border-radius: 4px; background: rgba(0,0,0,.7); }
.pane iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
.phone .pane { background: #070908; }
.phone .pane iframe { border-radius: 22px; box-shadow: 0 0 0 8px #1b1f1d; }
/* Side by side needs a computer-sized screen (1100 px or wider). */
.small { display: none; padding: 2rem 1.25rem; max-width: 32rem; margin: 0 auto; line-height: 1.5; }
.small h2 { font-size: 1.5rem; margin: 0 0 .6rem; }
.small p { font-size: 1.05rem; color: #c4ccc2; }
.small a { display: block; margin-top: .8rem; padding: .85rem 1rem; border-radius: 10px; font-weight: 800; color: var(--ivory); text-decoration: none; }
.small a { background: #1b2520; }
body.too-small .bar, body.too-small .panes { display: none; }
body.too-small .small { display: block; }
</style>
</head>
<body>
<div class="bar">
  <h1>Side by side</h1>
  <div class="grp" role="group" aria-label="How many boards">
    <button type="button" data-count="2" title="Two boards, any stations">2 boards</button>
    <button type="button" data-count="4" title="Every station at once, at phone size">4 boards</button>
  </div>
  <div class="grp two-only">
    <label for="pick0">Left</label><select id="pick0" aria-label="Left board"></select>
    <button type="button" id="swap" title="Swap the two boards">⇄</button>
    <label for="pick1">Right</label><select id="pick1" aria-label="Right board"></select>
  </div>
  <div class="grp two-only" role="group" aria-label="Board size">
    <button type="button" data-size="desktop" title="Each board at computer width">Desktop</button>
    <button type="button" data-size="phone" title="Each board at phone size">Phone</button>
  </div>
  <div class="grp"><button type="button" id="reload" title="Reload every board">Reload</button></div>
  <span class="sp"></span>
  <a id="back" href="index.html">Back</a>
</div>
<div class="small">
  <h2>Side by side needs a bigger screen</h2>
  <p>It shows several boards at once, which only fits on a computer or a large tablet. On a phone, use the station bar at the bottom of any board to switch.</p>
  <div id="small-links"></div>
</div>
<div class="panes" id="panes"></div>
<script src="hub.js"></script>
<script>
// Every station with a page (hub.js), in the same order as the station bar.
const HUB_LIST = Object.values(window.HUBS).filter((h) => h.page);
const byId = Object.fromEntries(HUB_LIST.map((h) => [h.id, h]));
// Each board is drawn at this computer width (the boards' desktop layout starts at
// 961 px), so it shrinks less to fit half the screen (owner, Nov 25: easier to read).
const DESKTOP_W = 1150, PHONE = [390, 844];
const store = { get: (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const params = new URLSearchParams(location.search);
const from = byId[params.get('from')] ? params.get('from') : null;
let count = store.get('splitCount', '2') === '4' ? 4 : 2;
let size = store.get('splitSize', 'desktop');
// The two boards in "2 boards". Opened from a board: that board on the left.
let pair = store.get('splitPair', 'nyp,gct').split(',').filter((id) => byId[id]);
if (pair.length !== 2) pair = HUB_LIST.slice(0, 2).map((h) => h.id);
if (from && !pair.includes(from)) pair[0] = from;
const panes = document.getElementById('panes');
const back = document.getElementById('back');
const backHub = byId[from] || HUB_LIST[0];
back.href = backHub.page;
back.textContent = `← ${backHub.short || backHub.name}`;
back.title = `Back to the ${backHub.name} board`;
document.getElementById('small-links').innerHTML = HUB_LIST.map((h) => `<a href="${h.page}" style="background:${h.tab ? h.tab.bg : '#1b2520'};color:${h.tab ? h.tab.ink : '#f2ead8'}">${h.name}</a>`).join('');
const picks = [document.getElementById('pick0'), document.getElementById('pick1')];
picks.forEach((sel, i) => {
  sel.innerHTML = HUB_LIST.map((h) => `<option value="${h.id}">${h.name}</option>`).join('');
  sel.addEventListener('change', () => {
    const other = 1 - i;
    // Picking the board already on the other side swaps them.
    if (sel.value === pair[other]) pair[other] = pair[i];
    pair[i] = sel.value;
    store.set('splitPair', pair.join(','));
    build();
  });
});
const shown = () => (count === 4 ? HUB_LIST.slice(0, 4).map((h) => h.id) : pair);
const sizeNow = () => (count === 4 ? 'phone' : size);
// One frame per board; a board already open keeps its frame (no reload) when
// the layout changes.
function build() {
  const ids = shown();
  picks.forEach((sel, i) => { sel.value = pair[i]; });
  const have = new Map([...panes.children].map((p) => [p.dataset.hub, p]));
  const keep = [];
  for (const id of ids) {
    const h = byId[id];
    let pane = have.get(id);
    if (!pane) {
      pane = document.createElement('div');
      pane.className = 'pane';
      pane.dataset.hub = id;
      pane.innerHTML = `<iframe title="${h.name} board"></iframe><span class="lab"><i style="background:${h.tab ? h.tab.bg : '#444'}"></i>${h.name}</span>`;
      pane.querySelector('iframe').addEventListener('load', bigText);
    }
    keep.push(pane);
  }
  [...panes.children].forEach((p) => { if (!keep.includes(p)) p.remove(); });
  // Put them in order, moving only what's out of place (moving a frame reloads it).
  keep.forEach((p, i) => { if (panes.children[i] !== p) panes.insertBefore(p, panes.children[i] || null); });
  keep.forEach((p) => { const f = p.querySelector('iframe'); const src = byId[p.dataset.hub].page; if (!f.getAttribute('src')) f.src = src; });
  panes.style.setProperty('--n', ids.length);
  document.body.classList.toggle('four', count === 4);
  document.querySelectorAll('[data-count]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.count === count)));
  document.title = ids.length === 4 ? 'All stations side by side' : `${byId[ids[0]].name} and ${byId[ids[1]].name}, side by side`;
  fit();
}
const frames = () => [...panes.querySelectorAll('iframe')];
// Bigger text inside the boards, only here and only at desktop size (the
// class goes on each board's own page; all are this site's pages).
function bigText() {
  for (const f of frames()) {
    try { f.contentDocument.documentElement.classList.toggle('split-big', sizeNow() === 'desktop'); } catch {}
  }
}
function fit() {
  bigText();
  const sz = sizeNow();
  document.body.classList.toggle('phone', sz === 'phone');
  document.querySelectorAll('[data-size]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.size === size)));
  for (const f of frames()) {
    const box = f.parentElement.getBoundingClientRect();
    if (sz === 'desktop') {
      const s = Math.min(1, box.width / DESKTOP_W);
      f.style.width = `${DESKTOP_W}px`;
      f.style.height = `${box.height / s}px`;
      f.style.transform = `scale(${s})`;
      f.style.left = '0px'; f.style.top = '0px';
    } else {
      // Four across: fill the column's width, as tall as the screen allows.
      const pad = count === 4 ? 16 : 24;
      const s = Math.min(1, (box.width - pad) / PHONE[0]);
      const h = count === 4 ? Math.max(PHONE[1], (box.height - pad) / s) : PHONE[1];
      const s2 = count === 4 ? s : Math.min(s, (box.height - 24) / PHONE[1]);
      f.style.width = `${PHONE[0]}px`;
      f.style.height = `${h}px`;
      f.style.transform = `scale(${s2})`;
      f.style.left = `${(box.width - PHONE[0] * s2) / 2}px`;
      f.style.top = `${count === 4 ? pad / 2 : (box.height - h * s2) / 2}px`;
    }
  }
}
document.querySelectorAll('[data-count]').forEach((b) => b.addEventListener('click', () => { count = +b.dataset.count; store.set('splitCount', String(count)); build(); }));
document.querySelectorAll('[data-size]').forEach((b) => b.addEventListener('click', () => { size = b.dataset.size; store.set('splitSize', size); fit(); }));
document.getElementById('swap').addEventListener('click', () => { pair.reverse(); store.set('splitPair', pair.join(',')); build(); });
document.getElementById('reload').addEventListener('click', () => frames().forEach((f) => f.contentWindow && f.contentWindow.location.reload()));
const BIG = matchMedia('(min-width: 1100px)');
function start() {
  document.body.classList.toggle('too-small', !BIG.matches);
  if (!BIG.matches) { panes.innerHTML = ''; return; }
  build();
}
addEventListener('resize', () => { if (BIG.matches) fit(); });
BIG.addEventListener('change', start);
start();
</script>
</body>
</html>
